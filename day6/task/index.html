<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Products Form</h2>

        <!-- Form Section -->
        <form id="productForm" onsubmit="event.preventDefault();">
            <input type="text" id="productName" placeholder="Product Name">
            <input type="text" id="productDesc" placeholder="Description">
            
            <select id="productColor">
                <option value="Red">Red</option>
                <option value="Blue">Blue</option>
                <option value="Green">Green</option>
                <option value="Yellow">Yellow</option>
                <option value="black">black</option>
            </select>

            <label for="outOfStock">
                <input id="outOfStock" type="checkbox"> Out of Stock
            </label>

            <button type="button" id="btnAdd" onclick="addProduct()">Add</button>
            <button type="button" id="btnUpdate" onclick="updateProduct()" style="display: none;">Update</button>
        </form>

        <!-- Search Input -->
        <input type="text" id="searchInput" onkeyup="searchProduct(this.value)" placeholder="Search by name...">

        <!-- Table Section -->
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Color</th>
                    <th>Out of Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows will be dynamic via JS -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
